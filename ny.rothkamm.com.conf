<VirtualHost *:80>
    DocumentRoot /var/www/html/ROTHKAMM
    ServerName one.rothkamm.com
    ServerAlias rothkamm.com
    Alias /album "/var/www/html/ROTHKAMM/album.php"
    Alias /albums "/var/www/html/ROTHKAMM/albums.php"
    Alias /latest "/var/www/html/ROTHKAMM/latest.php"
    Alias /random "/var/www/html/ROTHKAMM/random.php"
    Alias /solo "/var/www/html/ROTHKAMM/solo.php"
    Alias /piano "/var/www/html/ROTHKAMM/piano.php"
    Alias /group "/var/www/html/ROTHKAMM/group.php"
    Alias /tracks "/var/www/html/ROTHKAMM/tracks.php"
    Alias /pdfs "/var/www/html/ROTHKAMM/pdfs.php"
    Alias /csound "/var/www/html/ROTHKAMM/csound.php"
    Alias /electronic "/var/www/html/ROTHKAMM/electronic.php"
    Alias /iformm "/var/www/html/ROTHKAMM/iformm.php"
    Alias /bio "/var/www/html/ROTHKAMM/biography.php"

        <Directory "/var/www/html/ROTHKAMM" >
        AcceptPathInfo On
        Allow From All
        RewriteEngine on
        RewriteBase "/var/www/html/ROTHKAMM"

        RewriteCond "$1.php" -f
        RewriteCond "$1.cfm" !-f
        RewriteRule "^(.*).cfm$" "$1.php"

        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule (.*)$1.php [L]

        </Directory>
</VirtualHost>

